<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Điểm danh QNU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--ink:#1b2a2f;--muted:#5d6f75;--line:#d9e1e3;--bg:#eef2f2;--card:#fff;--accent:#0b6e6e;--accent-d:#085656;--danger:#b3261e;--ok:#1b7a3d}
*{box-sizing:border-box}
body{margin:0;font-family:"Be Vietnam Pro",Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 48px}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
header.top h1{margin:0;font-size:22px}
.badge{font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}
.card h2{margin:0 0 14px;font-size:17px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:720px){.grid{grid-template-columns:1fr}}
label{display:block;font-weight:500;font-size:14px;margin:0 0 4px}
.field{margin-bottom:12px}
.row{display:flex;gap:10px}.row>*{flex:1}
input,select{width:100%;padding:10px;border:1px solid #b9c5c8;border-radius:8px;font:inherit;background:#fff}
input:focus,select:focus,button:focus-visible{outline:3px solid #8fd3d3;outline-offset:1px}
button,a.btn{display:block;text-align:center;text-decoration:none;font:inherit;font-weight:700;border:0;border-radius:8px;padding:11px 16px;background:var(--accent);color:#fff;cursor:pointer;width:100%;margin-top:8px}
button:hover,a.btn:hover{background:var(--accent-d)}
button:disabled{opacity:.55;cursor:not-allowed}
button.ghost,a.ghost{background:#fff;color:var(--accent);border:1px solid var(--accent)}
button.ghost:hover,a.ghost:hover{background:#e6f3f3}
button.danger{background:var(--danger)}
.msg{margin-top:10px;font-size:14px;font-weight:500;min-height:20px}
.msg.err{color:var(--danger)}.msg.ok{color:var(--ok)}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
#qrbox{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px}
#qrcode{padding:10px;background:#fff;border:1px solid var(--line);border-radius:8px;min-height:50px}
.tablewrap{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line)}
th{background:var(--accent);color:#fff;position:sticky;top:0}
tr.vang td{color:#8a979b}
.hidden{display:none!important}
.sv{max-width:440px;margin:0 auto}
.info{background:#e6f3f3;border-radius:8px;padding:12px;margin-bottom:16px;font-size:14px}
.info b{display:block;font-size:17px}
</style>
</head>
<body>
<div class="wrap">

<!-- Sinh viên (mở bằng QR) -->
<div id="viewSV" class="hidden sv">
  <header class="top"><h1>Điểm danh QNU</h1></header>
  <div class="card">
    <div class="info" id="svInfo">Đang kiểm tra mã QR...</div>
    <form id="formSV" class="hidden">
      <div class="field">
        <label for="svTen">Chọn tên của bạn</label>
        <select id="svTen" required></select>
      </div>
      <button type="submit" id="btnSV">Điểm danh</button>
    </form>
    <p id="svMsg" class="msg"></p>
  </div>
</div>

<!-- Đăng nhập quản lý -->
<div id="viewLogin" class="hidden sv">
  <header class="top"><h1>Quản lý điểm danh</h1></header>
  <div class="card">
    <form id="formLogin">
      <div class="field"><label for="mk">Mã quản lý</label><input id="mk" type="password" required></div>
      <button type="submit" id="btnLogin">Đăng nhập</button>
      <p id="loginMsg" class="msg err"></p>
    </form>
  </div>
</div>

<!-- Quản lý -->
<div id="viewQL" class="hidden">
  <header class="top"><h1>Quản lý điểm danh QNU</h1><span class="badge" id="badgeSheet"></span></header>

  <div class="card">
    <h2>Tạo buổi học</h2>
    <form id="formTao">
      <div class="grid">
        <div>
          <div class="field"><label for="tenMon">Tên môn học</label><input id="tenMon" type="text" placeholder="VD: Lập trình Web" required></div>
          <div class="field"><label>Tiết học</label>
            <div class="row"><select id="tietTu" aria-label="Từ tiết"></select><select id="tietDen" aria-label="Đến tiết"></select></div></div>
        </div>
        <div>
          <div class="field"><label for="banKinh">Bán kính cho phép (mét)</label><input id="banKinh" type="number" min="20" max="1000" value="100" required></div>
          <div class="field"><label>Vị trí lớp học</label>
            <button type="button" id="btnViTri" class="ghost">Lấy vị trí hiện tại của tôi</button>
            <p class="hint" id="viTriInfo">Chưa lấy vị trí. Hãy bấm khi bạn đang ở trong lớp.</p></div>
        </div>
      </div>
      <button type="submit" id="btnTao">Tạo buổi học</button>
      <p id="taoMsg" class="msg"></p>
    </form>
  </div>

  <div class="card">
    <h2>Buổi học đang quản lý</h2>
    <div class="field"><select id="chonBuoi" aria-label="Chọn buổi học"><option value="">-- Chọn buổi học --</option></select></div>
    <div id="chiTiet" class="hidden">
      <div class="grid">
        <div>
          <button id="btnQR">Bật mã QR</button>
          <button id="btnDungQR" class="danger hidden">Dừng mã QR</button>
          <div id="qrbox" class="hidden"><div id="qrcode"></div><div class="hint" id="qrHint"></div></div>
        </div>
        <div>
          <p class="badge" id="tomTat"></p>
          <a id="linkSheet" class="btn ghost" target="_blank" rel="noopener">Mở Google Sheet</a>
        </div>
      </div>
      <h2 style="margin-top:18px">Danh sách điểm danh <span class="badge" id="soLuong"></span></h2>
      <div class="tablewrap">
        <table>
          <thead><tr><th>STT</th><th>Họ và tên</th><th>Thời gian</th><th>Cách lớp</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

</div>
<script src="app.js"></script>
</body>
</html>
